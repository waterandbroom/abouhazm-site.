<style>
*{box-sizing:border-box}
body{margin:0;background:#fbfaf7;color:#1b2e5a;font:16px/1.6 Cairo,Poppins,sans-serif;min-height:100vh}
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:380px;background:#fff;border-radius:18px;box-shadow:0 10px 40px rgba(27,46,90,.12);padding:30px 24px;text-align:center}
.dot{width:46px;height:46px;border-radius:50%;background:#ffc83d;margin:0 auto 14px}
.card h1{font:700 20px/1.3 Cairo,sans-serif;margin:0 0 16px}
input{width:100%;font:600 18px Poppins,sans-serif;text-align:center;letter-spacing:.12em;padding:12px;border:2px solid #d9deea;border-radius:12px;direction:ltr;color:#1b2e5a}
input:focus{outline:none;border-color:#1b2e5a}
button{margin-top:12px;width:100%;font:700 16px Cairo,sans-serif;background:#1b2e5a;color:#fff;border:0;border-radius:12px;padding:12px;cursor:pointer}
button:disabled{opacity:.6}
.err{color:#c0392b;font-size:14px;min-height:22px;margin:10px 0 0}
#app{max-width:1080px;margin:0 auto;padding:32px 16px 48px}
.hd h1{font:700 30px/1.2 Cairo,sans-serif;margin:0}
.hd p{color:#6b7591;margin:4px 0 24px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.bk{display:flex;gap:14px;background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 18px rgba(27,46,90,.08)}
.bk img{width:108px;height:auto;align-self:flex-start;border-radius:6px;box-shadow:0 3px 10px rgba(0,0,0,.18);flex:none}
.bk h3{font:700 17px/1.35 Cairo,Poppins,sans-serif;margin:0}
.bk .st{color:#6b7591;font-size:13px;margin:2px 0 6px}
.bk p{margin:0;font-size:14px;line-height:1.55}
.mt{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mt span{font-size:12px;background:#fff4d6;border-radius:20px;padding:2px 10px;direction:ltr}
h2{font:700 20px Cairo,sans-serif;margin:36px 0 10px}
.pr{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.pr li{background:#fff;border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;box-shadow:0 2px 10px rgba(27,46,90,.06)}
.pr span{color:#6b7591;font-size:14px}
.ft{color:#9aa2b8;font-size:13px;margin-top:30px;text-align:center}
.out{display:block;margin:18px auto 0;width:auto;background:none;color:#6b7591;font-size:13px;text-decoration:underline}

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=s=>(s||"").toUpperCase().replace(/\s+/g,"");
async function open_(code){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(norm(code)),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(SALT),iterations:IT,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},k,u8(DATA)));
}
const b=document.getElementById("b"),c=document.getElementById("c"),e=document.getElementById("e");
async function go(code,quiet){
  b.disabled=true;e.textContent="";
  try{const h=await open_(code);try{localStorage.setItem("bk_code",norm(code))}catch(_){}
    const a=document.getElementById("app");a.innerHTML=h+'<button class="out" id="o" type="button">خروج</button>';a.hidden=false;document.getElementById("lk").remove();
    document.getElementById("o").onclick=()=>{try{localStorage.removeItem("bk_code")}catch(_){}location.reload()};}
  catch(_){b.disabled=false;if(!quiet)e.textContent="الرمز غير صحيح.";}
}
b.onclick=()=>go(c.value);c.onkeydown=ev=>{if(ev.key==="Enter")go(c.value)};
(function(){let s="";try{s=localStorage.getItem("bk_code")||""}catch(_){}if(s)go(s,true)})();
</script>
