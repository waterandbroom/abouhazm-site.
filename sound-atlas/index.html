<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sound Atlas</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Lora:ital,wght@1,500&family=Noto+Naskh+Arabic:wght@500&display=swap">
<style>
html,body{margin:0;height:100%}
body{background:#fbfaf7;color:#2E5FB8;font-family:Poppins,'Noto Naskh Arabic',sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
.l{display:flex;justify-content:center;margin-bottom:22px}
.l span{width:46px;height:46px;border-radius:50%;background:#ffc83d}
.l span+span{background:#bbceff;margin-inline-start:-16px;mix-blend-mode:multiply}
h1{font:800 clamp(34px,7vw,56px)/1.1 Poppins,sans-serif;margin:0}
h1 i{font:italic 500 1em Lora,serif;color:#e0457b}
h2{font:600 20px/1.5 Poppins,'Noto Naskh Arabic',sans-serif;margin:18px 0 6px}
p{color:#6b7591;margin:0 0 26px;font-family:'Noto Naskh Arabic',Poppins,sans-serif}
a{color:#2E5FB8;font-size:15px}
</style>
<script>if(location.hash.length>1)location.replace("/sound-atlas/audio/"+location.hash);</script>
</head>
<body><main>
<div class="l"><span></span><span></span></div>
<h1 dir="ltr">Sound <i>Atlas</i></h1>
<h2>قريبًا</h2>
<p>الكتاب في طور الإعداد للنشر.</p>
<a href="/">العودة إلى الموقع</a>
</main></body>
</html>
